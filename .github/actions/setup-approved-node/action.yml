name: Set up admitted Node dependencies
description: Use the isolated admission store; never execute package installation scripts in privileged jobs.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-node
      with:
        install: 'false'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: approved-dependencies
    - name: Install without network or package scripts
      shell: bash
      run: |
        mkdir -p dist/approved
        tar -xf approved-dependencies.tar -C dist/approved
        pnpm install --offline --frozen-lockfile --ignore-scripts --store-dir dist/approved/pnpm
