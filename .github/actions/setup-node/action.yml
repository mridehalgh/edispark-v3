name: Set up workspace Node tooling
description: Install the repository-pinned pnpm before resolving its dependency cache.
inputs:
  install:
    description: Install workspace dependencies (disable when preparing an isolated approved store).
    default: 'true'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      with:
        run_install: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .node-version
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Install workspace dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
    - name: Build the explicitly allowed local SQLite binding
      if: inputs.install == 'true'
      shell: bash
      run: node tooling/ci/build-sqlite.mjs
