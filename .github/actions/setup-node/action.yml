name: Set up workspace Node tooling
description: Install the repository-pinned pnpm before resolving its dependency cache.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        run_install: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Install workspace dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
