version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
  - package-ecosystem: terraform
    directories: [/infrastructure/terraform/foundation, /infrastructure/terraform/release, /infrastructure/terraform/edge, /infrastructure/terraform/bootstrap]
    schedule: { interval: weekly }
