name: Admit reviewed dependencies
on:
  workflow_dispatch:
    inputs:
      emergency: { type: boolean, default: false }
      security_issue: { type: string, required: false }
permissions:
  contents: read
jobs:
  admit:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/admit-dependencies-apply.yml
    with:
      emergency: ${{ inputs.emergency }}
      security_issue: ${{ inputs.security_issue }}
