name: Plan and apply infrastructure
on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      root: { type: string, required: true }
permissions:
  contents: read
concurrency:
  group: infrastructure-${{ inputs.environment }}-${{ inputs.root }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}-${{ inputs.root }}-plan
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      safe: ${{ steps.policy.outputs.safe }}
    env:
      TF_ROOT: infrastructure/terraform/${{ inputs.root }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: node tooling/ci/install-tools.mjs terraform
      - uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ vars.AWS_INFRASTRUCTURE_PLAN_ROLE_ARN }}
          aws-region: eu-west-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Save the exact plan for review
        env:
          TF_BACKEND_CONFIGURATION_JSON: ${{ vars.TF_BACKEND_CONFIGURATION_JSON }}
          TF_VARIABLES_JSON: ${{ vars.TF_VARIABLES_JSON }}
        run: |
          node tooling/ci/check-infrastructure.mjs
          node -e 'const fs=require("fs"); fs.writeFileSync("backend.json", process.env.TF_BACKEND_CONFIGURATION_JSON); fs.writeFileSync("variables.json", process.env.TF_VARIABLES_JSON)'
          .ci-tools/terraform -chdir="$TF_ROOT" init -lockfile=readonly -backend-config="$PWD/backend.json"
          if test "$TF_ROOT" = infrastructure/terraform/release; then
            .ci-tools/terraform -chdir="$TF_ROOT" output -json deployment > live-release.json
            node -e 'const fs=require("fs"); const live=JSON.parse(fs.readFileSync("live-release.json")); const configured=JSON.parse(fs.readFileSync("variables.json")); for (const key of ["backend_image","revisions","traffic"]) configured[key]=live[key]; fs.writeFileSync("variables.json",JSON.stringify(configured))'
          fi
          .ci-tools/terraform -chdir="$TF_ROOT" plan -input=false -out="$PWD/infrastructure.tfplan" -var-file="$PWD/variables.json"
          .ci-tools/terraform -chdir="$TF_ROOT" show -json "$PWD/infrastructure.tfplan" > infrastructure.json
          sha256sum infrastructure.tfplan > infrastructure.sha256
      - name: Classify changes
        id: policy
        run: |
          if node tooling/ci/plan-policy.mjs infrastructure.json; then
            echo 'safe=true' >> "$GITHUB_OUTPUT"
          else
            echo 'safe=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infrastructure-plan-${{ inputs.environment }}-${{ inputs.root }}
          path: |
            infrastructure.tfplan
            infrastructure.json
            infrastructure.sha256
          retention-days: 1
  apply:
    needs: plan
    runs-on: ubuntu-24.04
    environment: ${{ format('{0}-{1}-{2}', inputs.environment, inputs.root, needs.plan.outputs.safe == 'true' && 'auto' || 'review') }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      TF_ROOT: infrastructure/terraform/${{ inputs.root }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: node tooling/ci/install-tools.mjs terraform
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: infrastructure-plan-${{ inputs.environment }}-${{ inputs.root }}
      - uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ vars.AWS_INFRASTRUCTURE_APPLY_ROLE_ARN }}
          aws-region: eu-west-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Apply the saved plan at its original commit
        env:
          TF_BACKEND_CONFIGURATION_JSON: ${{ vars.TF_BACKEND_CONFIGURATION_JSON }}
        run: |
          sha256sum -c infrastructure.sha256
          node -e 'require("fs").writeFileSync("backend.json", process.env.TF_BACKEND_CONFIGURATION_JSON)'
          .ci-tools/terraform -chdir="$TF_ROOT" init -lockfile=readonly -backend-config="$PWD/backend.json"
          .ci-tools/terraform -chdir="$TF_ROOT" apply -input=false "$PWD/infrastructure.tfplan"
