name: Promote through staging and production
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: release-promotion
  cancel-in-progress: false
jobs:
  staging:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
  production:
    needs: staging
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
