# Spring Boot Application Configuration
# Main configuration file for the Documents API application

# Server configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: never
    include-binding-errors: never

# Spring configuration
spring:
  application:
    name: documents-api
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 51MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER:http://localhost:3000}
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:3000/api/auth/jwks}
          jws-algorithms:
            - ${AUTH_JWS_ALGORITHM:ES256}
          audiences:
            - ${AUTH_AUDIENCE:http://localhost:3000}
  
  # Web MVC configuration (API-only, no static resources)
  web:
    resources:
      add-mappings: false  # Disable static resource handling
  mvc:
    favicon:
      enabled: false  # Disable favicon resolution
  
  # Jackson JSON configuration
  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

# Documents domain module configuration
documents:
  # DynamoDB table configuration
  dynamodb:
    table-name: ${DOCUMENTS_TABLE_NAME:myapp-documents-dev}

  seed:
    tenant-id: ${LOCAL_SEED_TENANT_ID:2OnHVzeAJKwm0ThFLcy1HfLHGPm}
  
  # Content storage configuration
  content:
    # Local file system storage (for development)
    local:
      directory: ${DOCUMENTS_CONTENT_DIR:./.content-store}
    
    # S3 storage (for production - not yet implemented)
    s3:
      enabled: ${DOCUMENTS_S3_ENABLED:false}
      bucket-name: ${DOCUMENTS_S3_BUCKET:}

# AWS configuration
aws:
  region: ${AWS_REGION:us-east-1}

# DynamoDB Local configuration (for development)
dynamodb:
  local:
    endpoint: ${DYNAMODB_LOCAL_ENDPOINT:http://localhost:8000}
    embedded: ${DYNAMODB_LOCAL_EMBEDDED:false}
    data-directory: ${DYNAMODB_LOCAL_DATA_DIR:.local/dynamodb}
    native-library-path: ${DYNAMODB_LOCAL_NATIVE_DIR:tooling/local-runtime/target/dependencies}

# Logging configuration
logging:
  level:
    root: INFO
    com.edispark.documents: DEBUG
    com.edispark.application: DEBUG
    software.amazon.awssdk: WARN
    com.amazonaws: WARN
    org.springframework.web: INFO

# Management endpoints (for health checks and monitoring)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
edispark:
  internal:
    token: ${EDISPARK_INTERNAL_TOKEN:}

# SpringDoc OpenAPI configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  show-actuator: false
