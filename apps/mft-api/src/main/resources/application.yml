server:
  port: ${MFT_SERVER_PORT:8081}
  error:
    include-message: never
spring:
  application:
    name: mft-api
  servlet:
    multipart:
      max-file-size: ${MFT_MAX_FILE_SIZE:100MB}
      max-request-size: ${MFT_MAX_REQUEST_SIZE:101MB}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER:http://localhost:3000}
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:3000/api/auth/jwks}
          jws-algorithms:
            - ${AUTH_JWS_ALGORITHM:ES256}
          audiences:
            - ${AUTH_AUDIENCE:http://localhost:3000}
mft:
  aws:
    region: ${AWS_REGION:eu-west-2}
    metadata-table: ${MFT_METADATA_TABLE:}
    payload-bucket: ${MFT_PAYLOAD_BUCKET:}
    key-store-table: ${MFT_KEY_STORE_TABLE:}
    key-store-logical-name: ${MFT_KEY_STORE_LOGICAL_NAME:}
    root-kms-key-arn: ${MFT_ROOT_KMS_KEY_ARN:}
    branch-key-cache-ttl-seconds: ${MFT_BRANCH_KEY_CACHE_TTL_SECONDS:600}
  events:
    bus-name: ${INTEGRATION_EVENT_BUS:}
  payload:
    directory: ${MFT_PAYLOAD_DIR:./.local/mft/payloads}
  secrets:
    directory: ${MFT_SECRET_DIR:./.local/mft/secrets}
    master-key-file: ${MFT_MASTER_KEY_FILE:./.local/mft/master.key}
  as2:
    max-message-bytes: ${MFT_AS2_MAX_MESSAGE_BYTES:26214400}
    max-outbound-payload-bytes: ${MFT_AS2_MAX_OUTBOUND_PAYLOAD_BYTES:104857600}
    certificate-rollover-grace-days: ${MFT_AS2_CERTIFICATE_ROLLOVER_GRACE_DAYS:7}
    admission:
      global-concurrency: ${MFT_AS2_GLOBAL_CONCURRENCY:64}
      partner-concurrency: ${MFT_AS2_PARTNER_CONCURRENCY:8}
      partner-requests-per-minute: ${MFT_AS2_PARTNER_REQUESTS_PER_MINUTE:600}
    allow-private-networks: ${MFT_ALLOW_PRIVATE_NETWORKS:false}
    allow-legacy-crypto: ${MFT_ALLOW_LEGACY_CRYPTO:false}
    async-mdn-url: ${MFT_ASYNC_MDN_URL:http://localhost:8081/as2/mdn}
    public-inbound-url: ${MFT_PUBLIC_AS2_URL:http://localhost:8081/as2}
    public-async-mdn-url: ${MFT_PUBLIC_AS2_MDN_URL:http://localhost:8081/as2/mdn}
    supported-encryption-algorithms: ${MFT_SUPPORTED_ENCRYPTION_ALGORITHMS:AES256-CBC}
    supported-signature-algorithms: ${MFT_SUPPORTED_SIGNATURE_ALGORITHMS:SHA-256}
    key-encryption-algorithm: ${MFT_KEY_ENCRYPTION_ALGORITHM:RSA-OAEP-SHA256}
    kms:
      signing-key-arn: ${MFT_AS2_SIGNING_KEY_ARN:}
      decryption-key-arn: ${MFT_AS2_DECRYPTION_KEY_ARN:}
      signing-certificate: ${MFT_AS2_SIGNING_CERTIFICATE:}
      encryption-certificate: ${MFT_AS2_ENCRYPTION_CERTIFICATE:}
      signing-certificate-base64: ${MFT_AS2_SIGNING_CERTIFICATE_BASE64:}
      encryption-certificate-base64: ${MFT_AS2_ENCRYPTION_CERTIFICATE_BASE64:}
  delivery:
    poll-interval-ms: ${MFT_DELIVERY_POLL_INTERVAL_MS:1000}
  local-demo:
    enabled: ${MFT_LOCAL_DEMO_SEED_ENABLED:true}
    tenant-id: ${LOCAL_SEED_TENANT_ID:2OnHVzeAJKwm0ThFLcy1HfLHGPm}
    identity-path: ${MFT_LOCAL_IDENTITY_PATH:../../.local/as2-simulator/edispark.p12}
    partner-certificate-path: ${MFT_LOCAL_PARTNER_CERTIFICATE_PATH:../../.local/as2-simulator/simulator.cer}
    password-file: ${MFT_LOCAL_IDENTITY_PASSWORD_FILE:../../.local/as2-simulator/password.txt}
    partner-endpoint: ${MFT_LOCAL_PARTNER_ENDPOINT:http://localhost:8082/as2}
    partner-id-file: ${MFT_LOCAL_DEMO_PARTNER_ID_FILE:../../.local/mft-demo-partner-id}
    tradacoms-partner-id-file: ${MFT_LOCAL_DEMO_TRADACOMS_PARTNER_ID_FILE:../../.local/mft-demo-tradacoms-partner-id}
springdoc:
  api-docs:
    path: /api-docs
management:
  endpoints:
    web:
      exposure:
        include: health,info
edispark:
  internal:
    token: ${EDISPARK_INTERNAL_TOKEN:}
logging:
  level:
    com.edispark.mft: INFO
